[project]
name = "project-name"
version = "0.1.0"
description = "PriceShape Data & AI project"
readme = "README.md"
requires-python = ">=3.12"
# PEP 639 reads this as an SPDX expression, so a bare "Proprietary" is rejected.
# LicenseRef- is the prefix SPDX reserves for identifiers that are not in its list.
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]

# ── Production runtime ────────────────────────────────────────────────────────
# The contract for docker/Dockerfile: this list, and nothing else, is installed
# into the serving image. If the image does not need it, it does not belong here
# — it belongs in a dependency group below.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "python-dotenv>=1.0.1",
    # Uncomment what this project actually serves with:
    # "numpy>=1.26",
    # "pandas>=2.2",
    # "scikit-learn>=1.5",
    # "sentence-transformers>=4.0",
    # "boto3>=1.34",          # only if serving code itself reaches S3
]

# ── Dependency groups (PEP 735) ───────────────────────────────────────────────
# Groups are never published and never installed by `pip install .`, so nothing
# here can reach production by accident. `dev` aggregates the rest via
# include-group, and uv installs `dev` by default — so a plain `uv sync` gives a
# developer the whole environment, and `uv sync --no-dev` gives production.
[dependency-groups]
# The shared engine: the DAG, the git gate, run logging and the data sync. It is
# development-only, exactly like the directory it replaced — production serves a
# model and never runs a pipeline.
#
# It is installed from a subdirectory of the template repository, pinned to an
# `engine-v*` tag, so nothing moves underneath a project until someone bumps it
# deliberately. uv records the tag's exact commit in uv.lock, so the pin is a SHA
# in practice even though the URL names a tag.
#
# The template repository is private, so CI needs a credential to fetch this —
# see the "Allow fetching the shared engine" step in .github/workflows/ci.yml.
# The production image never fetches it at all: `uv sync --no-dev` skips every
# dependency group, which is exactly the boundary this split exists to hold.
engine = [
    "priceshape-ml[tracking,kubeflow,data] @ git+ssh://git@github.com/priceshape-ai/data-and-ai-template@engine-v0.1.0#subdirectory=priceshape-ml",
]
lint = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Starlette's TestClient transport. httpx2, not httpx: current Starlette warns
    # StarletteDeprecationWarning on the latter, and a template should not hand every
    # project a deprecation warning on its first test run.
    "httpx2>=2.12",
    "import-linter>=2.0",   # enforces the prod/dev import boundary
]
# MLflow client. Skinny, not the full distribution: we log to a remote tracking
# server, and skinny drops sqlalchemy plus the `pandas<3` constraint that full
# mlflow would otherwise pin across the whole dev environment. If you need to run
# `mlflow server` or a local sqlite backend, add the `tracking-server` group too.
tracking = [
    "mlflow-skinny>=3.0",
]
tracking-server = [
    "mlflow>=3.0",
]
# DVC pulls ~60 transitive packages (botocore, aiobotocore, celery). Dev only.
data = [
    "dvc[s3]>=3.50",
]
viz = [
    "streamlit>=1.35",
    "watchdog>=6.0",        # Streamlit asks for it; without it file-watching polls
]
orchestration = [
    "kfp>=2.7",
]
notebook = [
    "ipykernel>=6.29",
]
dev = [
    {include-group = "engine"},
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "tracking"},
    {include-group = "data"},
    {include-group = "viz"},
    {include-group = "orchestration"},
    {include-group = "notebook"},
]

# ── Build ─────────────────────────────────────────────────────────────────────
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# A built wheel — and therefore the production image — contains ONLY this.
packages = ["src/core"]
# ...but an editable install also puts the repo root on sys.path, which is what
# makes `pipelines`, `tracking` and `viz` importable during development without
# any sys.path.insert() calls. This one setting is what lets the dev roots stay
# outside src/ while remaining first-class packages locally.
dev-mode-dirs = [".", "src"]

# ── Entrypoints ───────────────────────────────────────────────────────────────
[project.scripts]
# Production. Resolves from the wheel.
serve = "core.serving.app:run"
# Development only. Resolves from an editable install, via dev-mode-dirs above;
# it is deliberately absent from the production image.
pipeline = "pipelines.runner:main"

# ── Tooling ───────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
# Mirrors dev-mode-dirs above, and for the same reason: "src" makes core
# first-party, "." makes the dev roots first-party. Listing "pipelines" here
# instead would make its *submodules* top-level and scramble import sorting.
src = ["src", "."]
# The bundled engine is a separate distribution with its own pyproject, its own
# ruff settings and its own CI job (.github/workflows/engine.yml). `make lint`
# here checks this project. The directory does not exist in a generated project —
# bootstrap.py removes it — so this line is inert there.
extend-exclude = ["priceshape-ml"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["core", "pipelines", "viz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
# Most of the ML stack (uvicorn, torch, transformers, sentence-transformers) ships
# no type information. Chasing stubs for them is a treadmill with no payoff, so
# untyped third-party imports are allowed and the checking effort goes into our own
# code. Remove this if a project's dependencies are all typed.
ignore_missing_imports = true

# ── The prod/dev import boundary, enforced ────────────────────────────────────
# docs/architecture.md describes this boundary; these contracts are what actually
# hold it. `make lint` and CI both run `lint-imports`.
[tool.importlinter]
root_packages = ["core", "pipelines", "viz", "priceshape_ml"]
# Required because the contracts below forbid third-party packages (mlflow, dvc,
# streamlit, kfp), not just internal ones.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Production code never imports dev-only tooling"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = [
    "mlflow",
    "dvc",
    "streamlit",
    "kfp",
    "priceshape_ml",
    "pipelines",
    "viz",
]
