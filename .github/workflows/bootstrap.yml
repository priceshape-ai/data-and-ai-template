# Runs once, on the first push to a repository generated from this template, and
# then disables itself.
#
# IMPORTANT: no placeholder tokens and no project/package sentinels in this file —
# bootstrap.py deliberately skips .github/workflows/ when running in Actions,
# because GitHub rejects any GITHUB_TOKEN push that touches that directory, and one
# rejected file rejects the whole push.
name: Bootstrap template

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  bootstrap:
    # Never rewrite the template repository itself — only repositories made from it.
    #
    # `is_template` alone is NOT enough, and relying on it cost us the template
    # once. You create the repository, push, and only THEN tick "Template
    # repository" in settings — so on that first push is_template is still false,
    # the guard passes, and the workflow bootstraps the template itself: it
    # substitutes every token, deletes priceshape-ml/ and deletes bootstrap.py.
    # Every repository generated afterwards then inherits the template's own name
    # and has neither a bootstrapper nor an engine source left to fix it.
    #
    # The name check does not depend on a setting anyone has to remember, so it
    # holds from the very first push. It is a literal rather than a token on
    # purpose: it must survive into every generated project unchanged, and it
    # contains neither sentinel, so bootstrap.py's substitution leaves it alone.
    # (A job-level `if` cannot read `env`, so it cannot be factored out.)
    if: >-
      github.event.repository.is_template == false &&
      github.repository != 'priceshape-ai/data-and-ai-template'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v7

      # A second push must not re-bootstrap an already-bootstrapped project.
      # bootstrap.py deletes itself on success, so its absence is the marker.
      - name: Already bootstrapped?
        id: check
        run: |
          if [ -f bootstrap.py ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "bootstrap.py is gone — this repository is already bootstrapped."
          fi

      - uses: actions/setup-python@v7
        if: steps.check.outputs.run == 'true'
        with:
          python-version: "3.12"

      # bootstrap.py re-sorts imports after renaming the package, because the new
      # name sorts differently and would otherwise leave every generated project
      # with a failing `ruff check`. It needs a ruff to do that with.
      - name: Install ruff
        if: steps.check.outputs.run == 'true'
        run: pip install ruff

      - name: Bootstrap
        if: steps.check.outputs.run == 'true'
        env:
          # bootstrap.py checks this to skip .github/workflows/ — see above.
          GITHUB_ACTIONS: "true"
        run: |
          python bootstrap.py \
            --project "${{ github.event.repository.name }}" \
            --owner "${{ github.repository_owner }}" \
            --description "${{ github.event.repository.description }}"

      - name: Commit
        if: steps.check.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: bootstrap project from template"
            git push
          fi

      # bootstrap.py cannot delete this file (the push would be rejected), so the
      # workflow disables itself through the API instead. It is inert either way:
      # the job exits early once bootstrap.py is gone. `git rm` it whenever you like.
      - name: Disable this workflow
        if: steps.check.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT \
            "repos/${{ github.repository }}/actions/workflows/bootstrap.yml/disable" \
            || echo "Could not disable the workflow; it is inert regardless."

      # The commit above was pushed with GITHUB_TOKEN, and GitHub does not trigger
      # workflows on those — a recursion guard. Without this dispatch the only CI a
      # generated repository ever ran was against the raw template, on the initial
      # commit, and the bootstrapped code was never checked at all.
      - name: Run CI on the bootstrapped commit
        if: steps.check.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run ci.yml --ref "${GITHUB_REF_NAME}" \
            || echo "Could not dispatch CI; it will run on the next push."

      - name: Next steps
        if: steps.check.outputs.run == 'true'
        run: |
          {
            echo "### Bootstrapped"
            echo ""
            echo '```bash'
            echo "git pull"
            echo "cp .env.example .env"
            echo "\$EDITOR .env                 # AWS_PROFILE at least"
            echo "set -a; source .env; set +a"
            echo "uv sync"
            echo "make dvc-pull"
            echo '```'
            echo ""
            echo "See \`TEMPLATE_GUIDE.md\` for the recipes."
          } >> "$GITHUB_STEP_SUMMARY"
