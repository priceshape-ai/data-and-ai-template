# IMPORTANT: this file must contain no placeholder tokens and no project/package
# sentinels — see TEMPLATE_README.md for what those are.
#
# bootstrap.py skips .github/workflows/ entirely when running in Actions, because
# GitHub rejects any GITHUB_TOKEN push that touches that directory — and one
# rejected file rejects the whole push, which would leave a generated repository
# sitting on the raw template. So this workflow discovers the package directory at
# run time instead of having its name substituted in.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # bootstrap.yml dispatches this after it commits. A push made with GITHUB_TOKEN
  # does not trigger workflows — GitHub's recursion guard — so without this the
  # only CI a new repository ever ran was against the unbootstrapped template.
  workflow_dispatch:

jobs:
  quality:
    name: Lint, boundary & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # The engine is installed from a subdirectory of the template repository,
      # which is public — so this resolves with no credential, in this repository
      # and in every project generated from it. Nothing to configure.
      #
      # This probe exists for one failure: if the template is ever made private
      # again, `uv sync` fails partway through a 200-package resolve with
      # `remote: Repository not found`, because GitHub reports no-access to a
      # private repository as a 404. That message names neither the cause nor the
      # fix. The remote is read out of pyproject.toml so it is not written twice.
      - name: Check the shared engine is reachable
        run: |
          engine=$(sed -n 's|.*git+\(https://[^"#]*\).*|\1|p' pyproject.toml | head -1)
          engine=${engine%@*}
          if [ -z "$engine" ]; then
            echo "No engine git dependency in pyproject.toml; nothing to check."
          elif git ls-remote "$engine" HEAD >/dev/null 2>&1; then
            echo "Engine reachable anonymously: ${engine}"
          else
            echo "::error title=Shared engine unreachable::Cannot read ${engine} without credentials. It was public; if it has been made private, every project generated from this template needs a credential to install the engine — add an organisation secret with Contents:Read on it and restore the token rewrite in this step. The production install and the container image are unaffected: they never fetch the engine."
            exit 1
          fi

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src pipelines viz

      - name: Import boundary
        run: uv run lint-imports

      - name: Tests
        run: uv run pytest

  production-deps:
    name: Production installs without dev tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # The real assertion of the whole prod/dev split: resolve ONLY
      # [project].dependencies, then import the serving app. If production code
      # ever grows an `import mlflow`, this step fails with ModuleNotFoundError —
      # which is the failure we want, and much earlier than a broken deploy.
      #
      # Note there is no engine-reachability step in this job, and there must not
      # be: --no-dev selects no dependency group, so the shared engine is never
      # fetched. If this job ever starts needing the engine, something has put it
      # into [project].dependencies and the boundary has been broken.
      - name: Install production dependencies only
        run: uv sync --locked --no-dev

      # Every `uv run` below MUST carry --no-dev. A bare `uv run` re-syncs first,
      # and uv installs the `dev` group by default — silently reinstalling mlflow,
      # dvc and streamlit, which inverts what this job measures.
      - name: Serving app imports
        run: |
          package=$(ls src | head -1)
          uv run --no-dev python -c "import ${package}.serving.app; print('${package} serving imports cleanly')"

      - name: Dev-only tooling is absent
        run: |
          for module in mlflow dvc streamlit; do
            if uv run --no-dev python -c "import ${module}" 2>/dev/null; then
              echo "::error::${module} resolved with --no-dev; it must be in a dependency group"
              exit 1
            fi
          done
          echo "mlflow, dvc and streamlit are all correctly absent"

  image:
    name: Production image is clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -f docker/Dockerfile -t ci-image:test .

      - name: No dev tooling or dev roots in the image
        run: |
          for module in mlflow dvc streamlit pipelines viz; do
            if docker run --rm --entrypoint python ci-image:test -c "import ${module}" 2>/dev/null; then
              echo "::error::${module} is present in the production image"
              exit 1
            fi
          done

      - name: The API answers
        run: |
          docker run -d --name api -p 8000:8000 ci-image:test
          for _ in $(seq 1 30); do
            if curl -fs localhost:8000/livez; then break; fi
            sleep 1
          done
          curl -fs localhost:8000/healthz
          curl -fs -X POST localhost:8000/predict \
            -H 'content-type: application/json' \
            -d '{"texts":["a test title"]}'
          docker rm -f api
