# IMPORTANT: this file must contain no placeholder tokens and no project/package
# sentinels — see TEMPLATE_README.md for what those are.
#
# bootstrap.py skips .github/workflows/ entirely when running in Actions, because
# GitHub rejects any GITHUB_TOKEN push that touches that directory — and one
# rejected file rejects the whole push, which would leave a generated repository
# sitting on the raw template. So this workflow discovers the package directory at
# run time instead of having its name substituted in.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, boundary & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # The `engine` dependency group installs priceshape-ml from a subdirectory
      # of the template repository, which is private, and a runner has no SSH key
      # — so without a credential the sync fails with "Permission denied
      # (publickey)". Rewriting ssh:// to authenticated https lets uv fetch the
      # pinned commit without changing what pyproject.toml says, so a developer
      # with their own SSH key is unaffected.
      #
      # Two credentials can serve, and which one is available says where you are:
      #
      #   ENGINE_TOKEN   an organisation secret that can clone
      #                  priceshape-ai/data-and-ai-template. This is what a
      #                  generated project needs.
      #   GITHUB_TOKEN   always present, but scoped to the repository running the
      #                  job. That is enough in the template repository itself,
      #                  where the engine source is in this very repository, and
      #                  it is not enough anywhere else.
      #
      # So the fallback keeps the template green with no secret to configure, and
      # a generated project still fails loudly until ENGINE_TOKEN exists. Only the
      # name of the credential is ever echoed; the runner is discarded after the
      # job.
      - name: Allow fetching the shared engine
        env:
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$ENGINE_TOKEN" ]; then
            token="$ENGINE_TOKEN"
            source="ENGINE_TOKEN"
          else
            token="$FALLBACK_TOKEN"
            source="GITHUB_TOKEN"
            echo "::notice::ENGINE_TOKEN is not set; falling back to GITHUB_TOKEN, which can only read the repository running this job. That is enough while the engine source lives here. In a project generated from this template it is not, and the install below will fail — add ENGINE_TOKEN as an organisation secret: a read-only token that can clone priceshape-ai/data-and-ai-template."
          fi
          git config --global \
            url."https://x-access-token:${token}@github.com/".insteadOf \
            "ssh://git@github.com/"
          echo "Engine fetch: authenticated over https using ${source}."

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src pipelines viz

      - name: Import boundary
        run: uv run lint-imports

      - name: Tests
        run: uv run pytest

  production-deps:
    name: Production installs without dev tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # The real assertion of the whole prod/dev split: resolve ONLY
      # [project].dependencies, then import the serving app. If production code
      # ever grows an `import mlflow`, this step fails with ModuleNotFoundError —
      # which is the failure we want, and much earlier than a broken deploy.
      #
      # Note there is no engine-credential step in this job, and there must not
      # be: --no-dev selects no dependency group, so the shared engine is never
      # fetched. If this job ever starts needing ENGINE_TOKEN, something has put
      # the engine into [project].dependencies and the boundary has been broken.
      - name: Install production dependencies only
        run: uv sync --locked --no-dev

      # Every `uv run` below MUST carry --no-dev. A bare `uv run` re-syncs first,
      # and uv installs the `dev` group by default — silently reinstalling mlflow,
      # dvc and streamlit, which inverts what this job measures.
      - name: Serving app imports
        run: |
          package=$(ls src | head -1)
          uv run --no-dev python -c "import ${package}.serving.app; print('${package} serving imports cleanly')"

      - name: Dev-only tooling is absent
        run: |
          for module in mlflow dvc streamlit; do
            if uv run --no-dev python -c "import ${module}" 2>/dev/null; then
              echo "::error::${module} resolved with --no-dev; it must be in a dependency group"
              exit 1
            fi
          done
          echo "mlflow, dvc and streamlit are all correctly absent"

  image:
    name: Production image is clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -f docker/Dockerfile -t ci-image:test .

      - name: No dev tooling or dev roots in the image
        run: |
          for module in mlflow dvc streamlit pipelines viz; do
            if docker run --rm --entrypoint python ci-image:test -c "import ${module}" 2>/dev/null; then
              echo "::error::${module} is present in the production image"
              exit 1
            fi
          done

      - name: The API answers
        run: |
          docker run -d --name api -p 8000:8000 ci-image:test
          for _ in $(seq 1 30); do
            if curl -fs localhost:8000/livez; then break; fi
            sleep 1
          done
          curl -fs localhost:8000/healthz
          curl -fs -X POST localhost:8000/predict \
            -H 'content-type: application/json' \
            -d '{"texts":["a test title"]}'
          docker rm -f api
