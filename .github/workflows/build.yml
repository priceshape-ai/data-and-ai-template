# IMPORTANT: no placeholder tokens and no project/package sentinels in this file.
# bootstrap.py cannot rewrite anything under .github/workflows/ when it runs in
# Actions — GitHub rejects the push — so the image name is derived from the
# repository at run time instead. See TEMPLATE_README.md.
name: Build & push image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Derive image name
        id: meta
        run: |
          # Lowercased owner/repo — registries reject uppercase in a path.
          echo "image=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Verify before publishing, not after. An image that quietly carries mlflow
      # or the dev roots is exactly what the layout is designed to prevent, and a
      # pushed tag is far harder to walk back than a failed job.
      - name: Verify the image carries no dev-only code
        run: |
          image="${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          for module in mlflow dvc streamlit kfp pipelines tracking viz; do
            if docker run --rm --entrypoint python "$image" -c "import ${module}" 2>/dev/null; then
              echo "::error::${module} is present in the production image"
              exit 1
            fi
          done
          package=$(ls src | head -1)
          docker run --rm --entrypoint python "$image" -c "import ${package}.serving.app"

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
