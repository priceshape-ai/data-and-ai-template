# IMPORTANT: no placeholder tokens and no project/package sentinels in this file.
# bootstrap.py cannot rewrite anything under .github/workflows/ when it runs in
# Actions — GitHub rejects the push — so the image name is derived from the
# repository at run time instead. See TEMPLATE_README.md.
name: Build & push image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  # The company registry, and the role that reaches it. Every other PriceShape
  # repository pushes here — ai-productsmatcher, mlflow, poc-hybridsearch and
  # others — and it is where the cluster pulls from. OIDC_ROLE_ARN is an
  # organisation secret that resolves to DataDevRole; nothing is stored in the repo.
  AWS_REGION: eu-central-1
  REGISTRY: 626635402249.dkr.ecr.eu-central-1.amazonaws.com

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Derive image name
        id: meta
        run: |
          # The repository name alone — ECR repositories are flat, not owner/name.
          # Lowercased because registries reject uppercase in a path.
          echo "image=${REGISTRY}/$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: docker/setup-buildx-action@v4

      - name: Registry login
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Verify before publishing, not after. An image that quietly carries mlflow
      # or the dev roots is exactly what the layout is designed to prevent, and a
      # pushed tag is far harder to walk back than a failed job.
      - name: Verify the image carries no dev-only code
        run: |
          image="${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          for module in mlflow dvc streamlit pipelines viz; do
            if docker run --rm --entrypoint python "$image" -c "import ${module}" 2>/dev/null; then
              echo "::error::${module} is present in the production image"
              exit 1
            fi
          done
          package=$(ls src | head -1)
          docker run --rm --entrypoint python "$image" -c "import ${package}.serving.app"

      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
