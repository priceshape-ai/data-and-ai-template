[project]
name = "priceshape-ml"
version = "0.2.2"
description = "The pipeline engine, tracking and data sync shared by PriceShape Data & AI projects."
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"

# Nothing at all: the DAG, the cache and the git gate are standard library only.
# Everything else is an extra, so a project that wants the DAG installs the DAG and
# not a storage or tracking SDK with it.
dependencies = []

[project.optional-dependencies]
# `pip install priceshape-ml[tracking]` — the MLflow client. Skinny by default:
# the full distribution pins pandas<3 across the whole environment, and nothing
# here runs a tracking server.
tracking = ["mlflow-skinny>=3.0"]
# The DVC sync. Shells out to `dvc`, so this is what puts it on PATH.
data = ["dvc[s3]>=3.50"]
all = ["priceshape-ml[tracking,data]"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "mlflow-skinny>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/priceshape_ml"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
